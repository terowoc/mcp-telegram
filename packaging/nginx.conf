server {
    listen 80;
    listen [::]:80;
    server_name tg-mcp.azimboev.uz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tg-mcp.azimboev.uz;
    ssl_certificate /etc/letsencrypt/live/tg-mcp.azimboev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg-mcp.azimboev.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Query strings may contain authorization codes; avoid access logging them.
    access_log off;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:18770;
        proxy_http_version 1.1;
        proxy_set_header Host tg-mcp.azimboev.uz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host tg-mcp.azimboev.uz;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
}
