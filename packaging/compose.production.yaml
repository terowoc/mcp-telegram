name: mcp-telegram
services:
  mcp:
    image: ${MCP_IMAGE:?Set an immutable image digest}
    restart: unless-stopped
    init: true
    user: '1000:1000'
    env_file: telegram.env
    environment:
      NODE_ENV: production
      MCP_PUBLIC_URL: https://tg-mcp.azimboev.uz
      MCP_HTTP_PORT: '3000'
      MCP_AUTH_DIR: /data/auth
      MCP_OWNER_PASSWORD_HASH_FILE: /run/secrets/owner-password.hash
      MCP_TELEGRAM_FILE_ROOT: /data/files
      MCP_TELEGRAM_MAX_MEDIA_BYTES: '20971520'
      MCP_ALLOWED_ORIGINS: https://chatgpt.com,https://chat.openai.com,https://claude.ai
    ports:
      - '127.0.0.1:18770:3000'
    volumes:
      - ./data/telegram:/home/node/.mcp-telegram
      - ./data/auth:/data/auth
      - ./data/files:/data/files
      - ./owner-password.hash:/run/secrets/owner-password.hash:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: '1.0'
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
